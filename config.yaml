# ---------------------------------------------------------------------------
# Konfigurace Sorare MLB Lineup Builderu.
# Vše, co se může časem změnit na straně Sorare, je tady a ne v kódu.
# ---------------------------------------------------------------------------

# Formát sestavy: 7 slotů. Klíč = název slotu, hodnota = povolené Sorare pozice.
# POZOR: ověř si názvy přes `python -m sorare_mlb probe`. Zařazení catchera
# se v minulosti měnilo.
lineup:
  size: 7
  slots:
    SP:   [BASEBALL_STARTING_PITCHER]
    RP:   [BASEBALL_RELIEF_PITCHER]
    # Ověřeno chybou ze Sorare: CI = First base, Third base, Designated hitter.
    # Catcher sem nepatří — patří k MI.
    CI:   [BASEBALL_FIRST_BASE, BASEBALL_THIRD_BASE, BASEBALL_DESIGNATED_HITTER]
    MI:   [BASEBALL_SECOND_BASE, BASEBALL_SHORTSTOP, BASEBALL_CATCHER]
    OF:   [BASEBALL_OUTFIELD]
    EH:   [BASEBALL_FIRST_BASE, BASEBALL_THIRD_BASE, BASEBALL_CATCHER,
           BASEBALL_SECOND_BASE, BASEBALL_SHORTSTOP, BASEBALL_OUTFIELD,
           BASEBALL_DESIGNATED_HITTER]
    FLEX: [BASEBALL_FIRST_BASE, BASEBALL_THIRD_BASE, BASEBALL_CATCHER,
           BASEBALL_SECOND_BASE, BASEBALL_SHORTSTOP, BASEBALL_OUTFIELD,
           BASEBALL_DESIGNATED_HITTER]

  # Pozice považované za pálkaře (pro stack bonus a projekce).
  hitter_positions:
    [BASEBALL_FIRST_BASE, BASEBALL_THIRD_BASE, BASEBALL_CATCHER,
     BASEBALL_SECOND_BASE, BASEBALL_SHORTSTOP, BASEBALL_OUTFIELD,
     BASEBALL_DESIGNATED_HITTER]
  pitcher_positions: [BASEBALL_STARTING_PITCHER, BASEBALL_RELIEF_PITCHER]

# Turnaje, o které se staráme. `slug` musí odpovídat slugu ze Sorare API —
# `probe` ti vypíše, co je aktuálně dostupné.
# Turnaje, o které se staráme.
# `slug_contains` se hledá ve slugu leaderboardu, `rarity` musí sedět přesně —
# bez ní by se to pokoušelo obsadit i leaderboardy pro karty, které nemáš.
# Pozn.: Hot Streaks se v API jmenuje "Hot Streak Champion" (champion_pve).
tournaments:
  - name: Hot Streaks
    slug_contains: champion_pve
    rarity: limited
    weight: 3.0            # priorita v ILP účelové funkci
    risk_mode: safe        # safe = maximalizuje floor, upside = maximalizuje ceiling
    require_confirmed_lineup: true
    max_lineups: 1
    # Hot Streak Champion je in-season soutěž: ze sedmi karet jich musí mít
    # aspoň 6 season bonus. Vynechej klíč, když turnaj neomezuje.
    min_in_season: 6
    # Práh aktuální úrovně streaku (body). Vyplň, a builder ukáže šanci ho
    # překonat. Nech prázdné, když nechceš.
    target_score:
  - name: Challenger
    slug_contains: challenger
    rarity: limited
    weight: 1.0
    risk_mode: upside
    require_confirmed_lineup: false
    max_lineups: 3

# Váhy vstupů do projekce bodů. Součet nemusí být 1, normalizuje se.
projection:
  hitter:
    l15_avg: 0.45          # průměr posledních 15 Sorare skóre
    l5_avg: 0.25           # nedávná forma
    season_avg: 0.10
    matchup: 0.12          # kvalita soupeřova nadhazovače (opačně)
    ballpark: 0.08         # park factor pro daný stadion
  pitcher:
    l15_avg: 0.30
    l5_avg: 0.15
    k_rate: 0.25           # K% — hlavní driver Sorare bodů u SP
    opp_offense: 0.20      # slabost soupeřova lineupu
    home_field: 0.10
  # Kolik Sorare skóre musí mít karta odehráno, aby se jí věřilo.
  min_games_for_trust: 5
  # Fallback skóre na zápas pro hráče bez historie (aby ILP nepadal).
  cold_start_score: 20.0
  # Sorare MLB sčítá body ze všech zápasů gameweeku, takže tým se 4 zápasy
  # má víc než tým se 2. Když by se pravidla změnila na průměr, dej false.
  sum_over_games: true
  # Váha Sorare projekce (nextClassicFixtureProjectedScore) ve výsledku.
  # 0 = jen vlastní model.
  sorare_weight: 0.35
  # Kolik zápasů týmu reliever v průměru nastoupí.
  rp_appearance_rate: 0.45
  # Typická směrodatná odchylka skóre na zápas podle role. Vlastní σ hráče
  # z L15 se k ní stahuje — 15 hodnot je na odhad rozptylu málo.
  sigma_prior:
    hitter: 9.0
    starting_pitcher: 14.0
    relief_pitcher: 7.0

# Účelová funkce: hodnota karty = mean ∓ λ·σ.
optimizer:
  # safe (Hot Streaks): trest za rozptyl — cílem je překonat práh.
  safe_lambda: 0.6
  # upside (Challenger): odměna za rozptyl — cílem je vysoké umístění.
  upside_lambda: 0.4

# Kdy automat staví sestavy (minuty před uzávěrkou z Sorare API).
# /api/tick volá GitHub Actions každých 15 min, tady se rozhoduje.
schedule:
  build_before_minutes: 60      # první návrh / odeslání
  recheck_before_minutes: 20    # přestavění s čerstvými startéry (jen CRON_MODE=auto)
  min_minutes_left: 3           # pod tímhle už nic neposílat

# Stacking — bonus za koncentraci pálkařů z jednoho reálného týmu.
stack:
  enabled: true
  bonus: 3.5               # bodů za každého pálkaře nad prvního ze stejného týmu
  max_from_team: 6         # tvrdý strop podle pravidel Sorare MLB
  apply_to: [Hot Streaks]  # stack chceme hlavně ve vlajkové sestavě

submission:
  # true = skládat i turnaje, kde už sestavu máš. Přepis funguje jen když
  # mutace ve schématu bere ID sestavy (viz /nastaveni → lineup_input);
  # jinak se už odeslané sestavy přeskočí.
  overwrite_existing: false

# Bezpečnostní pravidla.
safety:
  # Karta se nepustí do Hot Streaks, pokud její odhadovaný floor je pod tímhle.
  # Pozor: MLB pálkaři mají obrovský rozptyl skóre, takže floor vychází nízko
  # i u kvalitních hráčů. Nastav 0 pro vypnutí; nad ~8 začne prořezávat hodně.
  min_projected_floor: 0.0
  # Startující nadhazovač musí být ohlášený jako probable pitcher některého
  # zápasu v gameweeku. Bez toho hrozí, že vůbec nenastoupí = nula bodů.
  require_probable_pitcher: true
  # SP bez ohlášeného startu (chybí "PP" na kartě) dostane tenhle násobek
  # projekce. Nízká hodnota znamená, že se použije jen když žádný ohlášený
  # nadhazovač nezbyl — mít SP je přednější než mít lepšího pálkaře.
  # 0 = vyřadit úplně.
  unprojected_pitcher_multiplier: 0.05
  # Vyloučit hráče na IL bez ohledu na projekci.
  exclude_injured: true
  # Vyloučit hráče, jejichž tým daný den nehraje.
  require_scheduled_game: true
  # Hráč, který nenastoupil do zápasu za tolik dní, do sestavy nepatří —
  # typicky sedí na lavičce, je na farmě nebo se z něj stal záskok.
  # Oficiální MLB lineupy chodí pozdě, tohle je spolehlivější náhrada.
  max_days_without_game: 7
  # Kolik minut před deadlinem začít hlídat oficiální lineupy.
  lineup_check_window_minutes: 180

# Karty, které se nikdy nemají použít (slug karty).
blacklist_cards: []

# Rarity, se kterými pracujeme.
rarities: [limited, rare, super_rare, unique]

api:
  sorare_url: https://api.sorare.com/graphql
  mlb_url: https://statsapi.mlb.com/api/v1
  requests_per_minute: 40
  cache_ttl_minutes: 30

# ---------------------------------------------------------------------------
# Přehledy a sporty
# ---------------------------------------------------------------------------
overview:
  # Jak dlouho držet stažený přehled sbírky, než se stáhne znovu.
  cache_minutes: 30

sports:
  mlb:
    enabled: true
    lineups_enabled: true
    # Karta bez zápasu déle než tolik dní se v přehledu ukáže jako „leží ladem“.
    idle_after_days: 10
  football:
    enabled: true
    # Skládání fotbalových sestav zatím není hotové (FootballAdapter).
    lineups_enabled: false
    # Hraješ jen Limited: karty i turnaje se filtrují na tuhle raritu.
    rarities: [limited]
    board_rarities: [limited]
    # Jedna stránka = 20 karet. Vercel funkce má 60 s, 15 stránek je bezpečně.
    max_card_pages: 15
    idle_after_days: 14
    # Turnaje, které se na dashboardu hlídají (chybějící sestava = upozornění).
    # Formát stejný jako `tournaments` výše; slugy zjistíš na /api/upcoming.
    tournaments: []

rewards:
  # Kolik stránek (po 50 umístěních) stáhnout na sport při synchronizaci.
  max_pages: 6
