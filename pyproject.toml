[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sorare-mlb-lineups"
version = "0.1.0"
description = "Poloautomatické skládání sestav pro Sorare MLB (Hot Streaks + Challenger)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32",
  "bcrypt>=4.1",
  "PuLP>=2.8",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sorare-mlb = "sorare_mlb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
