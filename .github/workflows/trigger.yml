# Přesný spouštěč. Vercel Hobby cron umí jen jednou denně a čas negarantuje;
# GitHub Actions cron je zdarma a přesný na minuty, takže deadline-critical
# běhy řídíme odsud a Vercel jen vykonává práci.
#
# Nastav v repozitáři Secrets: APP_BASE_URL, INTERNAL_SECRET
name: Sorare lineup trigger

on:
  schedule:
    # Sorare MLB gameweeky: Po–Čt a Pá–Ne.
    # Časy jsou v UTC. Uprav si je podle reálných deadlinů svého fixture.
    # Pondělí 21:40 UTC (cca 20 min před typickým prvním zápasem 17:40 ET)
    - cron: "40 21 * * 1"
    # Pátek 21:40 UTC
    - cron: "40 21 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (odešle) nebo propose (jen navrhne)"
        required: false
        default: auto

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolej build endpoint
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron")
          cat /tmp/out.json
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint vrátil HTTP $code"
            exit 1
          fi

      - name: Počkej a zkontroluj výsledek
        run: |
          sleep 180
          curl -sS "${{ secrets.APP_BASE_URL }}/api/status" | tee /tmp/status.json
          state=$(python -c "import json;print(json.load(open('/tmp/status.json'))['state'])")
          echo "Stav jobu: $state"
          if [ "$state" = "FAILED" ]; then exit 1; fi
