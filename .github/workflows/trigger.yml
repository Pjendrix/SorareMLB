# Spouštěč řízený skutečnou uzávěrkou gameweeku.
#
# Workflow jen často „tiká“; kdy se sestavy staví, rozhoduje aplikace podle
# `cutOffDate` ze Sorare API (config.yaml → schedule). Pevné časy už nejsou
# potřeba a nerozbije je posun prvního zápasu.
#
# Okno 15–23 UTC pokrývá uzávěrky MLB (odpolední i večerní zápasy ET) a drží
# spotřebu pod limitem 2000 min/měsíc pro privátní repozitáře
# (36 běhů × ~1 min × 30 dní). Veřejný repozitář limit nemá.
#
# Secrets: APP_BASE_URL, INTERNAL_SECRET
name: Sorare lineup tick

on:
  schedule:
    - cron: "*/15 15-23 * * *"
  workflow_dispatch:

concurrency:
  group: sorare-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tik
        id: tick
        run: |
          code=$(curl -sS -m 70 -o /tmp/out.json -w "%{http_code}" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/tick")
          cat /tmp/out.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint vrátil HTTP $code"
            exit 1
          fi
          action=$(python3 -c "import json;print(json.load(open('/tmp/out.json')).get('action',''))")
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Zkontroluj výsledek jobu
        if: steps.tick.outputs.action == 'build' || steps.tick.outputs.action == 'recheck'
        run: |
          # Job pokračuje sám přes /api/continue; počkáme, až doběhne.
          for i in $(seq 1 12); do
            sleep 20
            curl -sS -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}" \
              "${{ secrets.APP_BASE_URL }}/api/status" -o /tmp/status.json
            state=$(python3 -c "import json;print(json.load(open('/tmp/status.json')).get('state','?'))" 2>/dev/null || echo "?")
            echo "Stav jobu: $state"
            case "$state" in
              DONE|NEEDS_REVIEW) exit 0 ;;
              FAILED) cat /tmp/status.json; exit 1 ;;
            esac
          done
          echo "::warning::Job do 4 minut nedoběhl"
